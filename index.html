<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Peak District Hikes Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body { margin:0; height:100% }
    #map { position:absolute; inset:0 }

    .marker{ cursor:pointer !important }
    .marker svg{ transform:scale(0.85); transform-origin:bottom center }

    .mapboxgl-popup{ filter:drop-shadow(0 14px 28px rgba(0,0,0,.45)); }
    .mapboxgl-popup-tip{ display:none !important; }

    .mapboxgl-popup-content{
      background:transparent !important;
      border:none !important;
      padding:0 !important;
      box-shadow:none !important;
      width:auto !important;
      overflow:visible !important;
      display:block;
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif !important;
      text-transform:capitalize;
    }

    /* ===== DESKTOP POPUP ===== */
    .popup-card{
      display:flex;
      align-items:stretch;
      background:#fff;
      border-radius:12px;
      overflow:hidden;
      width:fit-content;
      height:130px;
    }
    .img-wrap{
      width:140px; flex:0 0 140px; height:100%;
      border-radius:12px 0 0 12px;
      overflow:hidden; background:#000;
    }
    .img-wrap img{ width:100%; height:100%; object-fit:cover; display:block }

    .popup-body{
      box-sizing:border-box;
      padding:8px 12px 10px 10px;
      flex:0 0 140px;
      min-width:140px; max-width:140px;
      text-align:center;
      display:flex; flex-direction:column;
      justify-content:center;
      line-height:1.2;
      transform:translateY(-1px);
    }

    .popup-heading{ font-weight:800; font-size:11px; margin:2px 0 6px 0; color:#1E1E1E }
    .specs{ font-size:10px; display:flex; flex-direction:column; gap:3px; align-items:center; margin-top:2px; transform:translateY(1px); }
    .stats-group{ display:flex; flex-direction:column; gap:3px; align-items:center; transform:translateY(-2px); }
    .links-group{ display:flex; flex-direction:column; gap:3px; align-items:center; }
    .spec-row{ display:flex; align-items:center; justify-content:center; gap:4px }

    .icon{ width:16px; height:16px }
    .icon-red{ color:#EC2629 }
    .icon-blue{ color:#3899EC }
    .icon-img{
      width:12px; height:12px; display:block;
      filter: invert(41%) sepia(97%) saturate(1476%) hue-rotate(191deg) brightness(96%) contrast(101%);
    }

    .spec-value{ font-weight:800; color:#EC2629; font-size:11px }
    .popup-link{ color:#3899EC; font-weight:800; font-size:11px; text-decoration:none }
    .hike-gap{ margin-top:2px }

    /* ===== MOBILE POPUP ===== */
    @media (max-width:440px){
      .popup-card{ height:115px !important }
      .img-wrap{ width:105px !important; flex-basis:105px !important; height:115px !important }
      .popup-body{
        flex:0 0 105px !important;
        min-width:105px !important;
        max-width:105px !important;
        padding:4px 6px !important;
      }

      .popup-heading{ font-size:9.5px !important }
      .specs{ font-size:8.5px !important }
      .spec-value{ font-size:9.5px !important }
      .popup-link{ font-size:10px !important }
      .icon{ width:11px !important; height:11px !important }
      .icon-img{ width:9px !important; height:9px !important }
    }

    /* ===== FULLSCREEN MOBILE POPUP ===== */
    @media (max-width:440px){
      body.ios-fullscreen .popup-card{ height:calc(115px * 1.15) !important }
      body.ios-fullscreen .img-wrap{
        width:calc(105px * 1.15) !important;
        flex-basis:calc(105px * 1.15) !important;
        height:calc(115px * 1.15) !important;
      }
      body.ios-fullscreen .popup-body{
        flex:0 0 calc(105px * 1.15) !important;
        min-width:calc(105px * 1.15) !important;
        max-width:calc(105px * 1.15) !important;
        padding:calc(4px * 1.15) calc(6px * 1.15) !important;
      }

      body.ios-fullscreen .popup-heading{ font-size:calc(9.5px * 1.15) !important }
      body.ios-fullscreen .specs{ font-size:calc(8.5px * 1.15) !important }
      body.ios-fullscreen .spec-value{ font-size:calc(9.5px * 1.15) !important }
      body.ios-fullscreen .popup-link{ font-size:calc(10px * 1.15) !important }
      body.ios-fullscreen .icon{ width:calc(11px * 1.15) !important; height:calc(11px * 1.15) !important }
      body.ios-fullscreen .icon-img{ width:calc(9px * 1.15) !important; height:calc(9px * 1.15) !important }
    }

    /* ===== REMOVE TAP/FOCUS HIGHLIGHTS ===== */
    .eye-btn {
      position:absolute; top:6px; left:6px; background:rgba(0,0,0,.5);
      border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:2; padding:0;
    }
    .eye-btn:hover { background:rgba(0,0,0,.75); }
    .marker-eye-overlay {
      display:none; position:absolute; width:0; height:0; overflow:visible;
      top:-10px; left:50%; transform:translateX(-50%); pointer-events:none;
    }
    .marker-eye-overlay > div { pointer-events:auto; cursor:pointer; }
    .marker.info-hidden .marker-eye-overlay { display:block; pointer-events:auto; }

    .popup-link,
    .popup-link:focus,
    .popup-link:active,
    .popup-link:focus-visible{
      background:transparent !important;
      outline:none !important;
      border:none !important;
      box-shadow:none !important;
    }
    .popup-link, .popup-link *{
      -webkit-tap-highlight-color:transparent !important;
      -webkit-touch-callout:none !important;
      -webkit-user-select:none !important;
    }

    /* ===== BOTTOM RIGHT STACK ===== */
    .mapboxgl-ctrl-bottom-right {
      display:flex !important;
      flex-direction:column !important;
      align-items:flex-end !important;
      gap:6px !important;
    }

    .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-group,
    .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-fullscreen { order:1; }
    .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl-attrib { order:2; }

    /* ===== ATTRIBUTION POSITION (ONLY CHANGE) ===== */
    .mapboxgl-ctrl-attrib{
      transform: translate(-1px, 3px);
    }
  </style>
</head>

<body>
<div id="map"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.0/dist/togeojson.umd.js"></script>

<script>
mapboxgl.accessToken="pk.eyJ1IjoicmVtbWlhZ2JlYmkiLCJhIjoiY21odHRrYTQzMTk0bjJqcjE1b2xhZ2FraSJ9.nTCz33gX0gQt3T4A6VD0oQ";

const RED="#EC2629", BLUE="#3899EC";

const IMG={
  derwent:"https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/main/images/derwent-dam-tower.jpg",
  crashed:"https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/main/images/b29-overexposed-crash-site.jpg",
  kinder:"https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/main/images/kinder-scout-carved-rock.png"
};

const hikes=[
  {
    id:"derwent-edge",
    name:"Derwent Edge",
    coords:[-1.7427849606990842,53.400582126300236],
    hikeUrl:"https://www.thelostpeak.co.uk/peak-district-hikes/derwent-edge-hike",
    directionsUrl:"https://www.google.com/maps/dir/?api=1&destination=53.400582126300236,-1.7427849606990842",
    gpx:"https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/refs/heads/main/gpx/Derwent%20Edge.gpx",
    photo:IMG.derwent,
    specs:{ duration:"3 to 4 hours", length:"7.4 miles", ascent:"367m" }
  },
  {
    id:"crashed-plane",
    name:"Crashed Plane Hike",
    coords:[-1.8689,53.4329],
    hikeUrl:"https://www.thelostpeak.co.uk/peak-district-hikes/the-crashed-plane-hike",
    directionsUrl:"https://www.google.com/maps/dir/?api=1&destination=53.4329,-1.8689",
    gpx:"https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/refs/heads/main/gpx/The%20Crashed%20Plane%20Hike.gpx",
    photo:IMG.crashed,
    specs:{ duration:"2 to 3 hours", length:"3.6 miles", ascent:"145m" }
  },
  {
    id:"kinder-scout",
    name:"Kinder Scout",
    coords:[-1.8151209383535991,53.364872107766416],
    hikeUrl:"https://www.thelostpeak.co.uk/peak-district-hikes/kinder-scout-hike",
    directionsUrl:"https://www.google.com/maps/dir/?api=1&destination=53.364872107766416,-1.8151209383535991",
    gpx:"https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/refs/heads/main/gpx/Kinder%20Scout%20Hike.gpx",
    photo:IMG.kinder,
    specs:{ duration:"4 to 6 hours", length:"8.3 miles", ascent:"562m" }
  }
];

const map=new mapboxgl.Map({
  container:"map",
  style:"mapbox://styles/mapbox/satellite-streets-v12",
  center:[-1.78,53.41],
  zoom:11,
  attributionControl:false
});

const nav=new mapboxgl.NavigationControl({ showCompass:true, showZoom:true });
map.addControl(nav,"bottom-right");
map.addControl(new mapboxgl.FullscreenControl(),"bottom-right");
map.addControl(new mapboxgl.AttributionControl({ compact:true }),"bottom-right");

function isIOS(){
  const ua=navigator.userAgent||"";
  const platform=navigator.platform||"";
  return /iPad|iPhone|iPod/.test(ua)||(platform==="MacIntel"&&navigator.maxTouchPoints>1);
}

const params=new URLSearchParams(location.search);

if(isIOS()&&params.get("fs")==="1"){
  document.body.classList.add("ios-fullscreen");
  const hide=()=>{
    const el=document.querySelector(".mapboxgl-ctrl-fullscreen");
    if(el) el.style.display="none";
  };
  hide(); setTimeout(hide,500);
}

function addIOSFullscreenButton(){
  if(!isIOS()) return;
  if(params.get("fs")==="1") return;

  const corner=document.querySelector(".mapboxgl-ctrl-bottom-right");
  if(!corner) return;

  const navGroup=[...corner.querySelectorAll(".mapboxgl-ctrl-group")]
    .find(g=>g.querySelector(".mapboxgl-ctrl-zoom-in"));
  if(!navGroup) return;

  const btn=document.createElement("button");
  btn.className="mapboxgl-ctrl-icon ios-fs-btn";
  btn.id="iosFullscreenBtn";
  btn.innerHTML=`
    <svg viewBox="0 0 24 24">
      <polyline points="4,9 4,4 9,4" fill="none" stroke="#000" stroke-width="2"/>
      <polyline points="20,9 20,4 15,4" fill="none" stroke="#000" stroke-width="2"/>
      <polyline points="4,15 4,20 9,20" fill="none" stroke="#000" stroke-width="2"/>
      <polyline points="20,15 20,20 15,20" fill="none" stroke="#000" stroke-width="2"/>
    </svg>`;
  const zoomOut=navGroup.querySelector(".mapboxgl-ctrl-zoom-out");
  const compass=navGroup.querySelector(".mapboxgl-ctrl-compass");
  if(zoomOut){
    navGroup.insertBefore(btn,compass||zoomOut.nextSibling);
  }else{
    navGroup.appendChild(btn);
  }
  btn.onclick=()=>{
    const url=new URL(location.href);
    url.searchParams.set("fs","1");
    window.open(url.toString(),"_blank");
  };
}

map.on("load",addIOSFullscreenButton);

const icons={
  clock:`<svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>`,
  length:`<svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h18M3 16h18"/><path d="M6 8v8M10 8v8M14 8v8M18 8v8"/></svg>`,
  ascent:`<svg class="icon icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18"/><path d="M6 18l5-6 4 4 5-7"/><path d="M20 7h-5v5"/></svg>`,
  walk:`<img class="icon-img" src="https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/main/icons/walking-person-go-walk-move-svgrepo-com.svg">`,
  directions:`<img class="icon-img" src="https://raw.githubusercontent.com/remmiagbebi-beep/peak-district-map/main/icons/marker-svgrepo-com.svg">`
};

function specsHTML(s,u){
  return `
    <div class="specs">
      <div class="stats-group">
        <div class="spec-row">${icons.clock}<span class="spec-value">${s.duration}</span></div>
        <div class="spec-row">${icons.length}<span class="spec-value">${s.length}</span></div>
        <div class="spec-row">${icons.ascent}<span class="spec-value">${s.ascent}</span></div>
      </div>
      <div class="links-group">
        <div class="spec-row hike-gap">${icons.walk}<a class="popup-link" href="${u.hikeUrl}" target="_top">Hike Page</a></div>
        <div class="spec-row">${icons.directions}<a class="popup-link" href="${u.directionsUrl}" target="_blank" rel="noopener">Directions</a></div>
      </div>
    </div>`;
}
function popupHtmlFor(h){
  const eyeBtn=`<button class="eye-btn" onclick="toggleInfo('${h.id}',event)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>`;
  return `
    <div class="popup-card">
      ${eyeBtn}
      <div class="img-wrap"><img src="${h.photo}" alt="${h.name}"></div>
      <div class="popup-body">
        <div class="popup-heading">${h.name}</div>
        ${specsHTML(h.specs,{hikeUrl:h.hikeUrl,directionsUrl:h.directionsUrl})}
      </div>
    </div>`;
}

async function loadGpx(url){
  const res=await fetch(url);
  const xml=new DOMParser().parseFromString(await res.text(),"text/xml");
  const gj=toGeoJSON.gpx(xml);
  return gj.features.find(f=>f.geometry?.type==="LineString");
}

const markerElsById={};
const routeLayers={}, routeAnims={};
let lockedId=null;
let hoverPopupObj=null;

function setMarkerColor(id,color){
  const el=markerElsById[id];
  if(!el) return;
  const p=el.querySelector("path");
  if(p) p.setAttribute("fill",color);
}

function addRoute(h,lineFeature){
  const id=h.id, coords=lineFeature.geometry.coordinates;
  let dists=[0];
  for(let i=1;i<coords.length;i++){
    const dx=coords[i][0]-coords[i-1][0],dy=coords[i][1]-coords[i-1][1];
    dists.push(dists[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  const total=dists[dists.length-1];
  const srcBase=`rb-${id}`,srcAnim=`ra-${id}`,lyrBase=`rl-${id}`,lyrAnim=`la-${id}`;
  map.addSource(srcBase,{type:"geojson",data:lineFeature});
  map.addLayer({id:lyrBase,type:"line",source:srcBase,paint:{"line-color":RED,"line-width":3.5,"line-opacity":0.7}});
  map.addSource(srcAnim,{type:"geojson",lineMetrics:true,data:{type:"Feature",geometry:{type:"LineString",coordinates:[]}}});
  map.addLayer({id:lyrAnim,type:"line",source:srcAnim,layout:{"line-cap":"round","line-join":"round"},paint:{
    "line-width":3.5,
    "line-opacity":0,
    "line-gradient":["interpolate",["linear"],["line-progress"],0,"#3899EC",1,"#FF8C00"]
  }});
  routeLayers[id]={srcBase,srcAnim,lyrBase,lyrAnim,coords,dists,total};
}

function showRoute(id){
  const r=routeLayers[id]; if(!r) return;
  map.setPaintProperty(r.lyrAnim,"line-opacity",1);
  startAnim(id);
}
function hideRoute(id){
  const r=routeLayers[id]; if(!r) return;
  stopAnim(id);
  map.setPaintProperty(r.lyrAnim,"line-opacity",0);
}
function startAnim(id){
  stopAnim(id);
  const r=routeLayers[id]; if(!r) return;
  const DUR=5500; let t0=null;
  function frame(ts){
    if(!routeAnims[id]?.active) return;
    if(!t0) t0=ts;
    const prog=((ts-t0)%DUR)/DUR, dist=prog*r.total, pts=[];
    for(let i=0;i<r.coords.length;i++){
      if(r.dists[i]<=dist){ pts.push(r.coords[i]); }
      else{
        if(pts.length>0&&i>0){
          const seg=r.dists[i]-r.dists[i-1],t=seg>0?(dist-r.dists[i-1])/seg:0;
          const p=r.coords[i-1],q=r.coords[i];
          pts.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]);
        }
        break;
      }
    }
    if(pts.length>=2){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:pts}}); }
    routeAnims[id].raf=requestAnimationFrame(frame);
  }
  routeAnims[id]={active:true,raf:requestAnimationFrame(frame)};
}
function stopAnim(id){
  if(routeAnims[id]){ routeAnims[id].active=false; cancelAnimationFrame(routeAnims[id].raf); delete routeAnims[id]; }
  const r=routeLayers[id];
  if(r){ const src=map.getSource(r.srcAnim); if(src) src.setData({type:"Feature",geometry:{type:"LineString",coordinates:[]}}); }
}

function showHoverPopup(h){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  setMarkerColor(h.id,BLUE); showRoute(h.id);
  hoverPopupObj=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat(h.coords).setHTML(popupHtmlFor(h)).addTo(map);
}
function hideHoverPopup(id){
  if(lockedId===id) return;
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  hideRoute(id); setMarkerColor(id,RED);
}
function lockHike(h){
  if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
  if(lockedId!==null&&lockedId!==h.id){
    hideRoute(lockedId); setMarkerColor(lockedId,RED);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
  }
  if(lockedId===h.id){ closeLocked(); return; }
  lockedId=h.id; setMarkerColor(h.id,BLUE); showRoute(h.id);
  map.panTo(h.coords,{duration:300});
  const p=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
    .setLngLat(h.coords).setHTML(popupHtmlFor(h)).addTo(map);
  lockedPopups[h.id]=p;
}
const lockedPopups={};
function closeLocked(){
  if(lockedId!==null){
    hideRoute(lockedId); setMarkerColor(lockedId,RED);
    if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
    lockedId=null;
  }
}

const isMobile=window.innerWidth<=768;

map.on("load",async()=>{
  const bounds=new mapboxgl.LngLatBounds();
  hikes.forEach(h=>{
    const el=document.createElement("div");
    el.className="marker";
    el.innerHTML=`<svg width="27" height="41" viewBox="0 0 27 41" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 0C6.044 0 0 6.044 0 13.5c0 9.375 13.5 27.5 13.5 27.5S27 22.875 27 13.5C27 6.044 20.956 0 13.5 0z" fill="${RED}"/><circle cx="13.5" cy="13.5" r="5" fill="white" opacity="0.9"/></svg><div class="marker-eye-overlay"><div onclick="toggleInfo('${h.id}',event)" style="position:absolute;top:-11px;left:-11px;width:22px;height:22px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></div></div>`;
    markerElsById[h.id]=el;
    new mapboxgl.Marker({element:el}).setLngLat(h.coords).addTo(map);
    bounds.extend(h.coords);
    if(!isMobile){
      el.addEventListener("mouseenter",()=>{ if(lockedId!==h.id&&!infoHiddenIds.has(h.id)) showHoverPopup(h); });
      el.addEventListener("mouseleave",()=>{ if(lockedId!==h.id&&!infoHiddenIds.has(h.id)) hideHoverPopup(h.id); });
    }
    el.addEventListener("click",evt=>{ evt.stopPropagation(); if(infoHiddenIds.has(h.id)){ toggleInfo(h.id,evt); return; } lockHike(h); });
  });
  map.on("click",()=>closeLocked());
  for(const h of hikes){
    try{
      const line=await loadGpx(h.gpx);
      if(line){
        addRoute(h,line);
        line.geometry.coordinates.forEach(c=>bounds.extend(c));
      }
    }catch(e){}
  }
  map.fitBounds(bounds,{padding:isMobile?30:110,maxZoom:isMobile?14:10.5});
  if(isMobile){
    map.once("idle",()=>{if(map.getZoom()>11.6) map.setZoom(11.6);});
  }
});

const infoHiddenIds=new Set();

window.toggleInfo=function(id,evt){
  if(evt) evt.stopPropagation();
  const el=markerElsById[id];
  if(infoHiddenIds.has(id)){
    infoHiddenIds.delete(id);
    const popup=lockedPopups[id];
    if(popup){ popup.getElement().style.opacity="1"; popup.getElement().style.pointerEvents="auto"; }
    if(el) el.classList.remove("info-hidden");
    return;
  }
  const h=hikes.find(x=>x.id===id); if(!h) return;
  if(!lockedPopups[id]){
    if(hoverPopupObj){ hoverPopupObj.remove(); hoverPopupObj=null; }
    if(lockedId!==null&&lockedId!==id){
      hideRoute(lockedId);
      if(lockedPopups[lockedId]){ lockedPopups[lockedId].remove(); delete lockedPopups[lockedId]; }
      setMarkerColor(lockedId,RED);
      infoHiddenIds.delete(lockedId);
      if(markerElsById[lockedId]) markerElsById[lockedId].classList.remove("info-hidden");
    }
    lockedId=id;
    const p=new mapboxgl.Popup({offset:22,closeButton:false,closeOnClick:false,anchor:"bottom"})
      .setLngLat(h.coords).setHTML(popupHtmlFor(h)).addTo(map);
    lockedPopups[id]=p;
  }
  const popup=lockedPopups[id]; if(!popup) return;
  infoHiddenIds.add(id);
  popup.getElement().style.opacity="0";
  popup.getElement().style.pointerEvents="none";
  if(el) el.classList.add("info-hidden");
};
</script>
</body>
